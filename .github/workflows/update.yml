name: update

# CS2-SharpUpdater main pipeline.
# On a CS2 update (or on demand), fetch old+new libserver.so, recover the CSS
# gamedata via reverse engineering, bump the native SDK + Metamod:Source
# submodules, build CounterStrikeSharp, and publish a ready-to-deploy release.
#
# TWO WAYS TO RUN:
#   * scheduled / automatic  - baseline mode: diffs the current build against the
#     previous run's binary; only proceeds when the BuildID changed.
#   * manual TEST            - manifest mode: you supply two depot manifest IDs
#     (from https://steamdb.info/depot/2347773/manifests/) and a CSS ref. Proves
#     the whole pipeline end-to-end without waiting for a real update.

on:
  #schedule:
  #  - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "baseline (auto-diff) or manifest (pinned test)"
        type: choice
        options: [baseline, manifest]
        default: baseline
      css_ref:
        description: "CounterStrikeSharp ref/tag to build (e.g. v1.0.305 or main)"
        default: "main"
      sdk_ref:
        description: "hl2sdk-cs2 commit/branch to pin (native engine ABI)"
        default: "cs2"
      mms_ref:
        description: "metamod-source commit/branch to pin (plugin API; master = current Metamod:Source dev build)"
        default: "master"
      old_manifest:
        description: "manifest mode: OLD depot 2347773 manifest ID"
        default: ""
      new_manifest:
        description: "manifest mode: NEW depot 2347773 manifest ID"
        default: ""
      publish_release:
        description: "publish a GitHub Release with the build"
        type: boolean
        default: true
      with_runtime:
        description: "bundle the .NET runtime into the zip (off = server must have the runtime)"
        type: boolean
        default: true

concurrency:
  group: cs2-sharpupdater
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: [self-hosted]        # must have Steam access + Docker
    env:
      WORK: ${{ github.workspace }}/../csu-work
      OUT: ${{ github.workspace }}/out
      STATE: ${{ github.workspace }}/../csu-state    # persists across runs on the box
      MODE: ${{ inputs.mode || 'baseline' }}
      CSS_REF: ${{ inputs.css_ref || 'main' }}
      SDK_REF: ${{ inputs.sdk_ref || 'cs2' }}
      MMS_REF: ${{ inputs.mms_ref || 'master' }}
    steps:
      - name: Wipe scratch work dir (clears root-owned Docker leftovers)
        run: |
          # The native/managed builds run in Docker as root and leave root-owned
          # files under $WORK. The runner user often can't delete those and may not
          # have passwordless sudo -- but it CAN run Docker, and Docker runs as
          # root, so use a throwaway container to remove them. Falls back to sudo,
          # then a plain rm. $STATE is never touched (it holds the baseline binary
          # that must persist across runs).
          WORK_PARENT="$(cd "$(dirname "$WORK")" && pwd)"
          WORK_NAME="$(basename "$WORK")"
          TARGET="$WORK_PARENT/$WORK_NAME"
          if [ -e "$TARGET" ]; then
            echo "removing $TARGET"
            docker run --rm -v "$WORK_PARENT:/w" alpine:3 sh -c "rm -rf \"/w/$WORK_NAME\"" \
              || sudo -n rm -rf "$TARGET" \
              || rm -rf "$TARGET" \
              || true
          fi
          rm -rf "$OUT" 2>/dev/null || true
          mkdir -p "$WORK" "$OUT"

      - name: Checkout updater
        uses: actions/checkout@v4

      - name: Tooling (install missing dependencies)
        run: |
          set -e
          SUDO=""
          if [ "$(id -u)" = 0 ]; then SUDO="env"; elif sudo -n true 2>/dev/null; then SUDO="sudo -n"; fi
          [ -n "$SUDO" ] && echo "root/sudo available" || echo "::warning::no passwordless sudo; will only do non-root installs"

          # --- apt packages ---
          need=()
          for pair in git:git readelf:binutils zip:zip unzip:unzip curl:curl python3:python3; do
            command -v "${pair%%:*}" >/dev/null || need+=("${pair##*:}")
          done
          python3 -m pip --version >/dev/null 2>&1 || need+=(python3-pip)
          command -v docker >/dev/null || need+=(docker.io)
          if [ ${#need[@]} -gt 0 ]; then
            echo "missing: ${need[*]}"
            if [ -n "$SUDO" ]; then
              $SUDO apt-get update -qq
              $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "${need[@]}"
            fi
          fi

          # --- pip (non-root bootstrap if apt could not provide it) ---
          if ! python3 -m pip --version >/dev/null 2>&1; then
            python3 -m ensurepip --user >/dev/null 2>&1 \
              || curl -fsSL https://bootstrap.pypa.io/get-pip.py | python3 - --user --break-system-packages \
              || curl -fsSL https://bootstrap.pypa.io/get-pip.py | python3 - --user
          fi
          python3 -m pip --version

          # --- python deps (pyelftools + capstone for the RE engine) ---
          python3 -m pip install --user --upgrade --break-system-packages pyelftools capstone 2>/dev/null \
            || python3 -m pip install --user --upgrade pyelftools capstone
          python3 -c "import elftools, capstone; print('pyelftools', elftools.__version__, 'capstone', capstone.__version__)"

          # --- required CLI tools (readelf/zip/unzip have python fallbacks) ---
          for t in git curl docker; do
            command -v "$t" >/dev/null || { echo "::error::'$t' is missing and could not be installed (no passwordless sudo). Install it on the runner: sudo apt-get install -y git curl docker.io"; exit 1; }
          done
          for t in readelf zip unzip; do
            command -v "$t" >/dev/null || echo "::notice::'$t' not found; using the python fallback"
          done
          docker --version

          # --- docker daemon access for the runner user ---
          if ! docker info >/dev/null 2>&1; then
            if [ -n "$SUDO" ]; then
              $SUDO systemctl enable --now docker 2>/dev/null || $SUDO service docker start 2>/dev/null || true
              $SUDO usermod -aG docker "$(id -un)" || true
            fi
            if docker info >/dev/null 2>&1; then
              echo "docker daemon: OK"
            elif sg docker -c 'docker info' >/dev/null 2>&1; then
              # membership added just now; this shell predates it, so run docker via sg
              echo "docker daemon: OK via 'sg docker' (restart the runner service to make it permanent)"
              echo "DOCKER_SG=1" >> "$GITHUB_ENV"
            else
              echo "::error::runner user $(id -un) cannot reach the Docker daemon. On the runner: sudo systemctl enable --now docker && sudo usermod -aG docker $(id -un) && restart the runner service (see README > Troubleshooting)."
              exit 1
            fi
          else
            echo "docker daemon: OK"
          fi

      - name: Fetch libserver.so (old + new)
        id: fetch
        env:
          STEAM_USER: ${{ secrets.STEAM_USER }}
          STEAM_PASS: ${{ secrets.STEAM_PASS }}
          OLD_MANIFEST: ${{ inputs.old_manifest }}
          NEW_MANIFEST: ${{ inputs.new_manifest }}
        run: |
          chmod +x tools/fetch_libserver.sh
          tools/fetch_libserver.sh

      - name: Run pipeline (RE + SDK bump + build)
        id: build
        if: steps.fetch.outputs.UPDATE == 'true'
        env:
          # default true on scheduled runs (inputs.with_runtime is empty then)
          BUNDLE_RUNTIME: ${{ (inputs.with_runtime == false) && '0' || '1' }}
        run: |
          chmod +x tools/run_pipeline.sh
          export OLD_SO="$WORK/libserver.old.so"
          export NEW_SO="$WORK/libserver.new.so"
          if [ "${DOCKER_SG:-0}" = "1" ]; then
            sg docker -c tools/run_pipeline.sh
          else
            tools/run_pipeline.sh
          fi
          echo "VERSION=$(cat "$OUT/VERSION")" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        # also on build failure: the recovered gamedata + report are still useful
        if: always() && steps.fetch.outputs.UPDATE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: counterstrikesharp-${{ steps.build.outputs.VERSION || format('recovery-{0}', steps.fetch.outputs.NEW_BUILDID) }}
          if-no-files-found: ignore
          path: |
            out/*.zip
            out/gamedata.json
            out/recovery-report.json

      - name: Publish Release
        if: steps.build.outcome == 'success' && (inputs.publish_release != false)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.build.outputs.VERSION }}
          name: CounterStrikeSharp ${{ steps.build.outputs.VERSION }}
          body: |
            Automated CounterStrikeSharp build with RE-recovered gamedata for CS2
            build `${{ steps.fetch.outputs.NEW_BUILDID }}` (was `${{ steps.fetch.outputs.OLD_BUILDID }}`).

            The `with-runtime` zip drops into `<server>/game/csgo/`. See the attached
            `recovery-report.json` for which signatures/offsets were repaired and
            anything flagged for review.
          files: |
            out/*.zip
            out/gamedata.json
            out/recovery-report.json

      - name: Promote baseline (baseline mode, successful build only)
        if: steps.build.outcome == 'success' && (github.event_name == 'schedule' || inputs.mode == 'baseline')
        run: |
          mkdir -p "$STATE"
          cp "$WORK/libserver.new.so" "$STATE/libserver.prev.so"
          echo "baseline promoted to ${{ steps.fetch.outputs.NEW_BUILDID }}"
