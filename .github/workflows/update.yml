name: update

# CS2-SharpUpdater main pipeline.
# On a CS2 update (checked every 15 minutes, or on demand), fetch old+new libserver.so,
# recover the CSS gamedata via reverse engineering, bump the native SDK + Metamod:Source
# submodules with any open s2sdk fixes applied, build CounterStrikeSharp and a Linux
# Metamod:Source, publish a ready-to-deploy release, and (when configured) roll it out
# to AMP-managed servers one at a time with an automatic rollback on a crash.
#
# Run modes:
#   * scheduled / automatic  - baseline mode: diffs the current build against the
#     previous run's binary; only proceeds when the BuildID changed.
#   * manual test            - manifest mode: takes two depot manifest IDs
#     (from https://steamdb.info/depot/2347773/manifests/) and a CSS ref, and runs
#     the whole pipeline end-to-end without waiting for a real update.

on:
  # Only does real work when the CS2 build changed (baseline mode)
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "baseline (auto-diff) or manifest (pinned test)"
        type: choice
        options: [baseline, manifest]
        default: baseline
      css_ref:
        description: "CounterStrikeSharp ref/tag to build (e.g. v1.0.305 or main)"
        default: "main"
      css_prs:
        description: "upstream CounterStrikeSharp pull requests to apply on top of css_ref, comma-separated (e.g. 1490)"
        default: ""
      sdk_repo:
        description: "hl2sdk-cs2 source: official (alliedmodders/s2sdk) or vindict6 (vindict6/hl2sdk-cs2)"
        type: choice
        options: [official, vindict6]
        default: official
      sdk_prs:
        description: "s2sdk pull requests to build with: auto (open header fixes from its contributors), none, or numbers like 128"
        default: "auto"
      sdk_ref:
        description: "hl2sdk-cs2 commit/branch to pin (native engine ABI)"
        default: "cs2"
      mms_ref:
        description: "metamod-source commit/branch to pin (plugin API; master = current Metamod:Source dev build)"
        default: "master"
      old_manifest:
        description: "manifest mode: OLD depot 2347773 manifest ID"
        default: ""
      new_manifest:
        description: "manifest mode: NEW depot 2347773 manifest ID"
        default: ""
      publish_release:
        description: "publish a GitHub Release with the build"
        type: boolean
        default: true
      with_runtime:
        description: "bundle the .NET runtime into the zip (off = server must have the runtime)"
        type: boolean
        default: true
      build_metamod:
        description: "also build a Linux Metamod:Source (mms_ref + the same s2sdk fixes) into the release"
        type: boolean
        default: true
      deploy:
        description: "roll the build out to the AMP servers in the AMP_TARGETS variable (needs the AMP_* secrets)"
        type: boolean
        default: true

concurrency:
  group: cs2-sharpupdater
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: [self-hosted]        # must have Steam access + Docker
    # Below GitHub's 6 h limit; deploy_amp.py stops starting new servers after 5 h, so it is never killed mid-swap
    timeout-minutes: 350
    env:
      WORK: ${{ github.workspace }}/../csu-work
      OUT: ${{ github.workspace }}/out
      STATE: ${{ github.workspace }}/../csu-state    # persists across runs on the box
      MODE: ${{ inputs.mode || 'baseline' }}
      CSS_REF: ${{ inputs.css_ref || 'main' }}
      CSS_PRS: ${{ inputs.css_prs || '' }}
      # Scheduled runs have no inputs: official s2sdk cs2 plus its open fixes (auto)
      SDK_REPO: ${{ inputs.sdk_repo == 'vindict6' && 'https://github.com/vindict6/hl2sdk-cs2.git' || 'https://github.com/alliedmodders/hl2sdk.git' }}
      SDK_REF: ${{ inputs.sdk_ref || 'cs2' }}
      SDK_PRS: ${{ inputs.sdk_prs || 'auto' }}
      GITHUB_TOKEN: ${{ github.token }}
      MMS_REF: ${{ inputs.mms_ref || 'master' }}
    steps:
      - name: Wipe scratch work dir (clears root-owned Docker leftovers)
        run: |
          # The native/managed builds run in Docker as root and leave root-owned
          # files under $WORK. The runner user often can't delete those and may not
          # have passwordless sudo, but it can run Docker as root, so a throwaway
          # container removes them. Falls back to sudo, then a plain rm. $STATE is
          # never touched (it holds the baseline binary that must persist across
          # runs).
          WORK_PARENT="$(cd "$(dirname "$WORK")" && pwd)"
          WORK_NAME="$(basename "$WORK")"
          TARGET="$WORK_PARENT/$WORK_NAME"
          if [ -e "$TARGET" ]; then
            echo "removing $TARGET"
            docker run --rm -v "$WORK_PARENT:/w" alpine:3 sh -c "rm -rf \"/w/$WORK_NAME\"" \
              || sudo -n rm -rf "$TARGET" \
              || rm -rf "$TARGET" \
              || true
          fi
          rm -rf "$OUT" 2>/dev/null || true
          mkdir -p "$WORK" "$OUT"

      - name: Checkout updater
        uses: actions/checkout@v4

      - name: Tooling (install missing dependencies)
        run: |
          set -e
          SUDO=""
          if [ "$(id -u)" = 0 ]; then SUDO="env"; elif sudo -n true 2>/dev/null; then SUDO="sudo -n"; fi
          [ -n "$SUDO" ] && echo "root/sudo available" || echo "::warning::no passwordless sudo; will only do non-root installs"

          # apt packages
          need=()
          for pair in git:git readelf:binutils zip:zip unzip:unzip curl:curl python3:python3; do
            command -v "${pair%%:*}" >/dev/null || need+=("${pair##*:}")
          done
          python3 -m pip --version >/dev/null 2>&1 || need+=(python3-pip)
          command -v docker >/dev/null || need+=(docker.io)
          if [ ${#need[@]} -gt 0 ]; then
            echo "missing: ${need[*]}"
            if [ -n "$SUDO" ]; then
              $SUDO apt-get update -qq
              $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "${need[@]}"
            fi
          fi

          # pip (non-root bootstrap if apt could not provide it)
          if ! python3 -m pip --version >/dev/null 2>&1; then
            python3 -m ensurepip --user >/dev/null 2>&1 \
              || curl -fsSL https://bootstrap.pypa.io/get-pip.py | python3 - --user --break-system-packages \
              || curl -fsSL https://bootstrap.pypa.io/get-pip.py | python3 - --user
          fi
          python3 -m pip --version

          # Python deps (pyelftools + capstone for the RE engine)
          python3 -m pip install --user --upgrade --break-system-packages pyelftools capstone 2>/dev/null \
            || python3 -m pip install --user --upgrade pyelftools capstone
          python3 -c "import elftools, capstone; print('pyelftools', elftools.__version__, 'capstone', capstone.__version__)"

          # Required CLI tools (readelf/zip/unzip have python fallbacks)
          for t in git curl docker; do
            command -v "$t" >/dev/null || { echo "::error::'$t' is missing and could not be installed (no passwordless sudo). Install it on the runner: sudo apt-get install -y git curl docker.io"; exit 1; }
          done
          for t in readelf zip unzip; do
            command -v "$t" >/dev/null || echo "::notice::'$t' not found; using the python fallback"
          done
          docker --version

          # Docker daemon access for the runner user
          if ! docker info >/dev/null 2>&1; then
            if [ -n "$SUDO" ]; then
              $SUDO systemctl enable --now docker 2>/dev/null || $SUDO service docker start 2>/dev/null || true
              $SUDO usermod -aG docker "$(id -un)" || true
            fi
            if docker info >/dev/null 2>&1; then
              echo "docker daemon: OK"
            elif sg docker -c 'docker info' >/dev/null 2>&1; then
              # The group membership is newer than this shell, so run docker via sg.
              echo "docker daemon: OK via 'sg docker' (restart the runner service to make it permanent)"
              echo "DOCKER_SG=1" >> "$GITHUB_ENV"
            else
              echo "::error::runner user $(id -un) cannot reach the Docker daemon. On the runner: sudo systemctl enable --now docker && sudo usermod -aG docker $(id -un) && restart the runner service (see README > Troubleshooting)."
              exit 1
            fi
          else
            echo "docker daemon: OK"
          fi

      - name: Fetch libserver.so (old + new)
        id: fetch
        env:
          STEAM_USER: ${{ secrets.STEAM_USER }}
          STEAM_PASS: ${{ secrets.STEAM_PASS }}
          OLD_MANIFEST: ${{ inputs.old_manifest }}
          NEW_MANIFEST: ${{ inputs.new_manifest }}
        run: |
          chmod +x tools/fetch_libserver.sh
          tools/fetch_libserver.sh

      - name: Run pipeline (RE + SDK bump + build)
        id: build
        if: steps.fetch.outputs.UPDATE == 'true'
        env:
          # Defaults to 1 on scheduled runs, where inputs.with_runtime is empty.
          BUNDLE_RUNTIME: ${{ (inputs.with_runtime == false) && '0' || '1' }}
        run: |
          chmod +x tools/run_pipeline.sh
          export OLD_SO="$WORK/libserver.old.so"
          export NEW_SO="$WORK/libserver.new.so"
          if [ "${DOCKER_SG:-0}" = "1" ]; then
            sg docker -c tools/run_pipeline.sh
          else
            tools/run_pipeline.sh
          fi
          echo "VERSION=$(cat "$OUT/VERSION")" >> "$GITHUB_OUTPUT"
          { echo "SUBMODULES<<EOF"; cat "$OUT/SUBMODULES"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Build Linux Metamod:Source
        id: metamod
        if: steps.build.outcome == 'success' && inputs.build_metamod != false
        run: |
          chmod +x tools/build_metamod.sh
          if [ "${DOCKER_SG:-0}" = "1" ]; then sg docker -c tools/build_metamod.sh; else tools/build_metamod.sh; fi
          { echo "METAMOD<<EOF"; cat "$OUT/METAMOD"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        # Runs even if the build failed, since the recovered gamedata and report are still useful.
        if: always() && steps.fetch.outputs.UPDATE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: counterstrikesharp-${{ steps.build.outputs.VERSION || format('recovery-{0}', steps.fetch.outputs.NEW_BUILDID) }}
          if-no-files-found: ignore
          path: |
            out/*.zip
            out/*.tar.gz
            out/gamedata.json
            out/recovery-report.json

      - name: Publish Release
        if: steps.build.outcome == 'success' && (inputs.publish_release != false)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.build.outputs.VERSION }}
          name: CounterStrikeSharp ${{ steps.build.outputs.VERSION }}
          body: |
            Automated CounterStrikeSharp build with RE-recovered gamedata for CS2
            build `${{ steps.fetch.outputs.NEW_BUILDID }}` (was `${{ steps.fetch.outputs.OLD_BUILDID }}`).

            Built against:
            ```
            ${{ steps.build.outputs.SUBMODULES }}
            ```

            Linux Metamod:Source (`mmsource-*-cs2-linux.tar.gz`, extract into `game/csgo/`):
            ```
            ${{ steps.metamod.outputs.METAMOD || 'not built' }}
            ```

            The `with-runtime` zip drops into `<server>/game/csgo/`. See the attached
            `recovery-report.json` for which signatures/offsets were repaired and
            anything flagged for review.
          files: |
            out/*.zip
            out/*.tar.gz
            out/gamedata.json
            out/recovery-report.json

      # Off until the repo has the AMP_URL/AMP_USER/AMP_PASSWORD(/AMP_TOTP_SECRET) secrets and the AMP_TARGETS and
      # AMP_GAME_HOST variables. One server at a time, first one first: a crash rolls that server back and stops.
      - name: Deploy to AMP servers
        id: deploy
        if: steps.build.outcome == 'success' && inputs.deploy != false && vars.AMP_TARGETS != ''
        env:
          AMP_URL: ${{ secrets.AMP_URL }}
          AMP_USER: ${{ secrets.AMP_USER }}
          AMP_PASSWORD: ${{ secrets.AMP_PASSWORD }}
          AMP_TOTP_SECRET: ${{ secrets.AMP_TOTP_SECRET }}
          AMP_TARGETS: ${{ vars.AMP_TARGETS }}
          AMP_GAME_HOST: ${{ vars.AMP_GAME_HOST }}
          AMP_WAIT_EMPTY_MINUTES: ${{ vars.AMP_WAIT_EMPTY_MINUTES || '120' }}
          DEPLOY_TAG: ${{ steps.build.outputs.VERSION }}
        run: |
          [ -n "$AMP_URL" ] && [ -n "$AMP_PASSWORD" ] || { echo "::warning::AMP_TARGETS is set but the AMP secrets aren't; not deploying"; exit 0; }
          css_zip=$(ls out/counterstrikesharp-*linux*.zip | head -1)
          mm_tar=$(ls out/mmsource-*-cs2-linux.tar.gz 2>/dev/null | head -1 || true)
          set +e
          python3 tools/deploy_amp.py "$css_zip" "$mm_tar"
          code=$?
          set -e
          # 0 deployed, 2 crashed and rolled back, 3 skipped or stopped on an error (try again later), 4 rollback incomplete
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = 0 ] || echo "::error::AMP deploy finished with code $code; see the log above"
          exit $code

      # Promote when the deploy is settled: done, not configured, or the build crashed a server and was rolled back
      # (retrying it every 15 minutes would crash it again). A skipped or interrupted deploy keeps the old baseline,
      # so the next scheduled run builds and tries again.
      - name: Promote baseline (baseline mode, successful build only)
        if: >-
          always() && steps.build.outcome == 'success' && (github.event_name == 'schedule' || inputs.mode == 'baseline')
          && (steps.deploy.outcome == 'skipped' || steps.deploy.outputs.code == '0' || steps.deploy.outputs.code == '2')
        run: |
          mkdir -p "$STATE"
          cp "$WORK/libserver.new.so" "$STATE/libserver.prev.so"
          echo "baseline promoted to ${{ steps.fetch.outputs.NEW_BUILDID }}"
